<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Simetra 2.0 - Sistema de Gestão Vero: Login</title>
  
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body class="login-page">

  <div class="login-split">
    
    <!-- Lado Esquerdo -->
    <div class="login-left">
      <!-- Formas gráficas -->
      <div class="circle-top-right"></div>
      <div class="circle-center"></div>
      <div class="circle-bottom-left"></div>

      <div class="login-welcome">Bem vindo de volta!</div>
      <h1 class="login-headline">
        Faça o seu login e tenha acesso ao<br>
        <span class="login-highlight">sistema de gestão</span><br>
        da Vero.
      </h1>

      <div class="login-footer-logo">
        <h2 class="logo-text">ver<span>o</span></h2>
        <p class="logo-tagline">Do tamanho do seu mundo</p>
      </div>
    </div>

    <!-- Lado Direito -->
    <div class="login-right">
      <div class="login-card">
        
        <div class="brand-logo-simetra">
          <h1>Simetr<span>a</span></h1>
          <p>Sistema de Gestão Vero</p>
        </div>

        <form class="login-form" id="loginForm">
          <div class="form-group">
            <input type="text" id="username" placeholder="alessandro.souza" required>
          </div>
          
          <div class="form-group">
            <input type="password" id="password" placeholder="•••••••••••••" required>
          </div>

          <div class="login-options">
            <span>Salvar Credenciais</span>
            <label class="toggle-switch">
              <input type="checkbox" id="saveCredentials" checked>
              <span class="slider"></span>
            </label>
          </div>

          <button type="submit" class="btn-login">Entrar</button>
        </form>

      </div>
    </div>

  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      // Simulação simples de login:
      // Salva um valor no localStorage para que o index.html saiba que o usuário está "logado".
      localStorage.setItem('vero_logged_in', 'true');
      const username = document.getElementById('username').value;
      if (username) {
        localStorage.setItem('vero_username', username);
      }
      // Redireciona para o sistema
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
